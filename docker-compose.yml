services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bindb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-bindb}?sslmode=disable"
      PORT: 8080
      GIN_MODE: release
      ENRICHMENT_ENABLED: "${ENRICHMENT_ENABLED:-false}"
      HANDY_API_KEY: "${HANDY_API_KEY:-}"
      HANDY_API_MONTHLY_LIMIT: "${HANDY_API_MONTHLY_LIMIT:-3000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-5}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-10}"
      GLOBAL_RATE_LIMIT_RPS: "${GLOBAL_RATE_LIMIT_RPS:-100}"
      GLOBAL_RATE_LIMIT_BURST: "${GLOBAL_RATE_LIMIT_BURST:-200}"
      RATE_LIMIT_MAX_CLIENTS: "${RATE_LIMIT_MAX_CLIENTS:-10000}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-20}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-30m}"
      DB_CONN_MAX_IDLE_TIME: "${DB_CONN_MAX_IDLE_TIME:-5m}"
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT:-5s}"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT:-10s}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT:-30s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT:-60s}"
      HTTP_SHUTDOWN_TIMEOUT: "${HTTP_SHUTDOWN_TIMEOUT:-10s}"
      HTTP_MAX_HEADER_BYTES: "${HTTP_MAX_HEADER_BYTES:-1048576}"
    ports:
      - "127.0.0.1:${PORT:-8828}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/v1/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

volumes:
  pgdata:
